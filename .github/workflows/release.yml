name: Build and Release MacSweeper

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'install.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set version
        run: echo "APP_VERSION=1.6.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build release binary
        run: swift build -c release

      - name: Generate App Icon from Assets/logo.png
        run: |
          cat << 'SWIFT' > /tmp/make_icon.swift
          import AppKit

          let iconset = "/tmp/MacSweeper.iconset"
          try? FileManager.default.removeItem(atPath: iconset)
          try! FileManager.default.createDirectory(atPath: iconset, withIntermediateDirectories: true)

          guard let src = NSImage(contentsOfFile: "Assets/logo.png") else {
              fatalError("Assets/logo.png not found")
          }

          let sizes: [(String, Int)] = [
              ("icon_16x16.png", 16), ("icon_16x16@2x.png", 32),
              ("icon_32x32.png", 32), ("icon_32x32@2x.png", 64),
              ("icon_128x128.png", 128), ("icon_128x128@2x.png", 256),
              ("icon_256x256.png", 256), ("icon_256x256@2x.png", 512),
              ("icon_512x512.png", 512), ("icon_512x512@2x.png", 1024)
          ]

          for (name, px) in sizes {
              let size = CGFloat(px)
              let img = NSImage(size: NSSize(width: size, height: size))
              img.lockFocus()
              let rect = NSRect(x: size * 0.08, y: size * 0.08, width: size * 0.84, height: size * 0.84)
              let path = NSBezierPath(roundedRect: rect, xRadius: size * 0.2, yRadius: size * 0.2)
              NSColor.white.setFill()
              path.fill()
              path.addClip()

              let pad = size * 0.14
              let availW = size - pad * 2
              let availH = size - pad * 2
              let aspect = src.size.width / max(1, src.size.height)
              var drawW = availW
              var drawH = availW / aspect
              if drawH > availH {
                  drawH = availH
                  drawW = availH * aspect
              }
              let drawRect = NSRect(x: (size - drawW) / 2, y: (size - drawH) / 2, width: drawW, height: drawH)
              src.draw(in: drawRect, from: .zero, operation: .sourceOver, fraction: 1.0)
              img.unlockFocus()

              if let tiff = img.tiffRepresentation,
                 let bitmap = NSBitmapImageRep(data: tiff),
                 let png = bitmap.representation(using: .png, properties: [:]) {
                  try! png.write(to: URL(fileURLWithPath: "\(iconset)/\(name)"))
              }
          }
          SWIFT
          swift /tmp/make_icon.swift
          iconutil -c icns /tmp/MacSweeper.iconset -o /tmp/AppIcon.icns

      - name: Package MacSweeper.app and zip
        run: |
          mkdir -p dist/MacSweeper.app/Contents/MacOS dist/MacSweeper.app/Contents/Resources
          cp .build/release/MacSweeper dist/MacSweeper.app/Contents/MacOS/MacSweeper
          cp /tmp/AppIcon.icns dist/MacSweeper.app/Contents/Resources/AppIcon.icns
          cat << PLIST > dist/MacSweeper.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>MacSweeper</string>
              <key>CFBundleIdentifier</key><string>com.local.macsweeper</string>
              <key>CFBundleName</key><string>MacSweeper</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
              <key>LSMinimumSystemVersion</key><string>13.0</string>
              <key>NSAppleEventsUsageDescription</key><string>MacSweeper asks Finder to move protected app leftovers to the Trash.</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - dist/MacSweeper.app
          ditto -c -k --sequesterRsrc --keepParent dist/MacSweeper.app dist/MacSweeper.zip

      - name: Checksum and sign release zip
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          (cd dist && shasum -a 256 MacSweeper.zip > MacSweeper.zip.sha256)
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            swift scripts/sign-update.swift dist/MacSweeper.zip > dist/MacSweeper.zip.sig
          else
            echo "::warning::UPDATE_SIGNING_KEY secret not set; release will not support in-app auto-install."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: MacSweeper v${{ env.APP_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/MacSweeper.zip
            dist/MacSweeper.zip.sha256
            dist/MacSweeper.zip.sig
